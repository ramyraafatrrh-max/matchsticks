<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hostage Escape — Matchstick Riddles</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--gold:#f3c34e;--gold-dim:#5a4a1f;--red:#e2483a;--green:#37c26b;--bg:#0d0f14;--panel:#171a22;--line:#2a2f3b;--txt:#eef1f6;--muted:#98a0b0;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1b2030 0%,var(--bg) 60%);color:var(--txt);font-family:"Segoe UI",system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;min-height:100%;}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 60px;width:100%;flex:1}
h1,h2,h3{font-weight:700;line-height:1.15}.center{text-align:center}.muted{color:var(--muted)}
.card{background:linear-gradient(180deg,#191d27,#12151d);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.45);}
.brand{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.85}
input[type=text],input[type=password],input[type=tel]{width:100%;padding:16px 18px;font-size:22px;letter-spacing:6px;text-align:center;background:#0e1017;color:var(--txt);border:1px solid var(--line);border-radius:12px;outline:none;}
input:focus{border-color:var(--gold)}
button{cursor:pointer;border:none;border-radius:12px;font-weight:700;font-size:16px;padding:14px 20px;background:var(--gold);color:#20180a;transition:.15s transform,.15s filter;}
button:hover{filter:brightness(1.06)}button:active{transform:translateY(1px)}
button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}button.danger{background:var(--red);color:#fff}
.err{color:var(--red);min-height:20px;font-size:14px;margin-top:10px}.ok{color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tab{background:linear-gradient(180deg,#1d222e,#141821);border:1px solid var(--line);border-radius:16px;padding:26px 18px;text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
.tab:hover{border-color:var(--gold);transform:translateY(-2px)}
.tab .tname{font-size:22px;font-weight:800}.tab .tsub{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:2px;text-transform:uppercase}
.tab.solveddone::after{content:"✓";position:absolute;top:10px;right:14px;color:var(--green);font-weight:900}
.riddle-links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rlink{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#12151d;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--txt);text-decoration:none;font-weight:600;}
.rlink:hover{border-color:var(--gold)}.rlink .st{font-size:12px;color:var(--muted)}
.rlink.done{border-color:#22432f;background:#0f1b14}.rlink.done .st{color:var(--green)}
.hint{background:#12151d;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px}
.videobox{position:relative;width:100%;padding-top:56.25%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;margin:8px 0 4px}
.videobox iframe,.videobox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.stage-scaler{width:100%;display:flex;justify-content:center;margin:10px 0 4px}
.stage{position:relative;transform-origin:top center}
.stick{position:absolute;border-radius:7px;background:linear-gradient(180deg,#ffd873,#e0a52c);box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 0 6px rgba(255,255,255,.25);cursor:pointer;transition:filter .12s;}
.stick::after{content:"";position:absolute;border-radius:50%;background:#b02f18;}
.stick.h::after{width:12px;height:12px;left:-4px;top:50%;transform:translateY(-50%)}
.stick.v::after{width:12px;height:12px;top:-4px;left:50%;transform:translateX(-50%)}
.stick:hover{filter:brightness(1.12)}
.stick.held{filter:brightness(1.35) drop-shadow(0 0 10px var(--gold));animation:wobble .5s infinite}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.slot{position:absolute;border-radius:7px;background:rgba(255,255,255,.04);border:2px dashed transparent;cursor:pointer;transition:.12s;}
.slot.active{border-color:rgba(243,195,78,.5);background:rgba(243,195,78,.08)}
.slot.active:hover{background:rgba(243,195,78,.18)}
.static{background:#3a4150;box-shadow:none;cursor:default}.static::after{display:none}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#12151d;border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;z-index:50;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;top:34px}.toast.good{border-color:var(--green);color:var(--green)}.toast.bad{border-color:var(--red);color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.82);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;flex-direction:column;text-align:center;}
.overlay.show{display:flex;animation:fade .3s}@keyframes fade{from{opacity:0}to{opacity:1}}
.big-correct{font-size:40px;font-weight:900;color:var(--green);letter-spacing:2px}
.confetti{position:fixed;top:-20px;font-size:22px;animation:fall linear forwards;z-index:59}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.output-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px}
.output-box .rn{font-size:15px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
.footerbar{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
a.link{color:var(--gold);text-decoration:none}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}.small{font-size:13px}
@media (max-width:560px){.grid2,.riddle-links{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="big-correct" id="overlayText">✅ CORRECT!</div></div>
<script>
/* ============ 1) CONFIG ============ */
const CONFIG = {
  ACCESS_CODE: "56139",
  MODERATOR_CODE: "RESET-2026",
  // Intro briefing video — local file hosted next to this page on GitHub.
  INTRO_VIDEO_URL: "joeharryintro.mp4",
  firebase: {
    apiKey: "AIzaSyAIZuezO47a8PcSkbhdqQRF9LfJnsP-SVg",
    authDomain: "hostage-game-dda89.firebaseapp.com",
    databaseURL: "https://hostage-game-dda89-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "hostage-game-dda89",
    storageBucket: "hostage-game-dda89.firebasestorage.app",
    messagingSenderId: "968050038111",
    appId: "1:968050038111:web:f666ec6810cbc189fe52ea"
  },
  TEAMS_COLLECTION: "teams",
  NAME_FIELD:       "name",
  PASSCODE_FIELD:   "accessCode",
  SOLVED_FIELD:     "solved",
  ORDER_FIELD:      "order"
};

/* ============ 2) DATABASE LAYER ============ */
const usingFirebase = !CONFIG.firebase.apiKey.startsWith("YOUR_") && typeof firebase !== "undefined";
let fdb=null;
if(usingFirebase){ firebase.initializeApp(CONFIG.firebase); fdb=firebase.firestore(); }

// Guarantee "solved" is always an array of numbers regardless of how it's stored.
function normSolved(v){
  if(Array.isArray(v)) return v.map(Number).filter(n=>!isNaN(n));
  if(v && typeof v==="object") return Object.values(v).map(Number).filter(n=>!isNaN(n));
  return [];
}

function seedMock(){
  if(localStorage.getItem("mockTeams")) return;
  const t=[{id:"team1",name:"Team Alpha",accessCode:"1111",order:1,solved:[]},
           {id:"team2",name:"Team Bravo",accessCode:"2222",order:2,solved:[]},
           {id:"team3",name:"Team Charlie",accessCode:"3333",order:3,solved:[]},
           {id:"team4",name:"Team Delta",accessCode:"4444",order:4,solved:[]}];
  localStorage.setItem("mockTeams",JSON.stringify(t));
}
seedMock();
const mock={all(){return JSON.parse(localStorage.getItem("mockTeams")||"[]")},save(a){localStorage.setItem("mockTeams",JSON.stringify(a))}};

const DB = {
  async getTeams(){
    if(usingFirebase){
      const snap=await fdb.collection(CONFIG.TEAMS_COLLECTION).get();
      let a=snap.docs.map(d=>({id:d.id,...d.data()}));
      a=a.filter(x=>x[CONFIG.NAME_FIELD]!==undefined && String(x[CONFIG.NAME_FIELD]).trim()!=="");
      a.sort((x,y)=>(x[CONFIG.ORDER_FIELD]||0)-(y[CONFIG.ORDER_FIELD]||0));
      return a.map(x=>({id:x.id,name:x[CONFIG.NAME_FIELD],passcode:String(x[CONFIG.PASSCODE_FIELD]),solved:normSolved(x[CONFIG.SOLVED_FIELD])}));
    }
    return mock.all().map(x=>({id:x.id,name:x.name,passcode:String(x.accessCode),solved:normSolved(x.solved)}));
  },
  async getTeam(id){
    if(usingFirebase){
      const d=await fdb.collection(CONFIG.TEAMS_COLLECTION).doc(id).get();
      if(!d.exists) return null; const x=d.data();
      return {id,name:x[CONFIG.NAME_FIELD],passcode:String(x[CONFIG.PASSCODE_FIELD]),solved:normSolved(x[CONFIG.SOLVED_FIELD])};
    }
    const t=mock.all().find(t=>t.id===id); return t?{id:t.id,name:t.name,passcode:String(t.accessCode),solved:normSolved(t.solved)}:null;
  },
  async markSolved(id,n){
    if(usingFirebase){
      const ref=fdb.collection(CONFIG.TEAMS_COLLECTION).doc(id);
      const d=await ref.get(); const cur=normSolved(d.exists?d.data()[CONFIG.SOLVED_FIELD]:[]);
      if(!cur.includes(n)) cur.push(n);
      await ref.update({[CONFIG.SOLVED_FIELD]:cur});
      return;
    }
    const a=mock.all();const t=a.find(x=>x.id===id);
    if(t){t.solved=normSolved(t.solved);if(!t.solved.includes(n)){t.solved.push(n);mock.save(a);}}
  },
  async resetTeam(id){
    if(usingFirebase){ await fdb.collection(CONFIG.TEAMS_COLLECTION).doc(id).update({[CONFIG.SOLVED_FIELD]:[]}); return; }
    const a=mock.all();const t=a.find(x=>x.id===id);if(t){t.solved=[];mock.save(a);}
  },
  async resetAll(){ const a=await DB.getTeams(); for(const t of a){ await DB.resetTeam(t.id); } }
};

/* ============ 3) MATCHSTICK ENGINE ============ */
const T=14,L=58;const DW=L+2*T,DH=2*L+3*T,GAP=20;const OW=DW;const MIDY=DH/2;
const SEG={0:"abcefg",1:"cf",2:"acdeg",3:"acdfg",4:"bcdf",5:"abdfg",6:"abdefg",7:"acf",8:"abcdefg",9:"abcdfg"};
function digitSegs(ch){return new Set(SEG[ch].split(""));}
function opSegs(ch){if(ch==="+")return new Set(["h","v"]);if(ch==="-")return new Set(["h"]);return new Set();}
function digitGeo(id){switch(id){
  case "a":return{x:T,y:0,w:L,h:T,o:"h"};case "b":return{x:0,y:T,w:T,h:L,o:"v"};
  case "c":return{x:T+L,y:T,w:T,h:L,o:"v"};case "d":return{x:T,y:T+L,w:L,h:T,o:"h"};
  case "e":return{x:0,y:2*T+L,w:T,h:L,o:"v"};case "f":return{x:T+L,y:2*T+L,w:T,h:L,o:"v"};
  case "g":return{x:T,y:2*T+2*L,w:L,h:T,o:"h"};}}
function opGeo(id){if(id==="h")return{x:T,y:MIDY-T/2,w:L,h:T,o:"h"};return{x:(OW-T)/2,y:MIDY-L/2,w:T,h:L,o:"v"};}
const RIDDLES={
 1:{title:"Riddle 1",cells:[d("5","6"),op("+","+"),d("7","1"),eq(),d("7","7")],output:"7"},
 2:{title:"Riddle 2",cells:[d("4","4"),op("-","+"),d("5","5"),eq(),d("8","9")],output:"9"},
 3:{title:"Riddle 3",cells:[d("9","0"),op("+","+"),d("3","3"),eq(),d("3","3")],output:"3"},
 4:{title:"Riddle 4",cells:[d("1","1"),op("+","+"),d("5","3"),eq(),d("4","4")],output:"4"},
 5:{title:"Riddle 5",cells:[d("1","1"),op("","-"),d("1","1"),op("+","+"),d("5","5"),eq(),d("6","5")],output:"5"},
 6:{title:"Riddle 6",cells:[d("7","7"),op("-","+"),d("2","2"),eq(),d("8","9")],output:"9"}
};
function d(i,t){return{type:"digit",init:i,target:t};}function op(i,t){return{type:"op",init:i,target:t};}function eq(){return{type:"equals"};}
function buildRiddle(r){
  let x=0;const slots=[];const initSet=new Set();const targetSet=new Set();const statics=[];
  r.cells.forEach((cell,ci)=>{
    if(cell.type==="equals"){statics.push({x:x+T,y:MIDY-L/2,w:L,h:T});statics.push({x:x+T,y:MIDY+L/2-T,w:L,h:T});x+=DW+GAP;return;}
    const ids=cell.type==="digit"?["a","b","c","d","e","f","g"]:["h","v"];
    const initA=cell.type==="digit"?digitSegs(cell.init):opSegs(cell.init);
    const tgtA=cell.type==="digit"?digitSegs(cell.target):opSegs(cell.target);
    ids.forEach(id=>{const g=cell.type==="digit"?digitGeo(id):opGeo(id);const key=ci+":"+id;
      slots.push({key,x:x+g.x,y:g.y,w:g.w,h:g.h,o:g.o});if(initA.has(id))initSet.add(key);if(tgtA.has(id))targetSet.add(key);});
    x+=(cell.type==="digit"?DW:OW)+GAP;
  });
  return{slots,initSet,targetSet,statics,width:x-GAP,height:DH};
}

/* ============ 4) UI HELPERS ============ */
const app=document.getElementById("app");
const toastEl=document.getElementById("toast");
const overlay=document.getElementById("overlay");
const overlayText=document.getElementById("overlayText");
function qp(k){return new URLSearchParams(location.search).get(k);}
function go(params){location.search=params;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg,type){toastEl.textContent=msg;toastEl.className="toast show "+(type||"");setTimeout(()=>toastEl.className="toast",1600);}
function setEq(a,b){if(a.size!==b.size)return false;for(const k of a)if(!b.has(k))return false;return true;}
function beep(freq,dur){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close();},dur);}catch(e){}}
function confettiBurst(){const em=["🎉","✨","💥","⭐","🔓","🎊"];for(let i=0;i<28;i++){const s=document.createElement("div");s.className="confetti";s.textContent=em[i%em.length];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(1.6+Math.random()*1.6)+"s";s.style.fontSize=(16+Math.random()*20)+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),3200);}}

/* ============ 5) SCREENS ============ */
function screenAccess(){
  app.innerHTML=`
   <div class="card center" style="max-width:520px;margin:6vh auto 0">
     <div class="brand">Hostage Protocol</div>
     <h1 style="margin:10px 0 4px">💣 Aftermath</h1>
     <p class="muted" style="font-size:18px;line-height:1.5;margin:14px 0 22px">
       If you're still alive after the bomb explosion,<br>write the code in the box to proceed.
     </p>
     <input id="ac" type="tel" inputmode="numeric" placeholder="•••••" maxlength="10" autocomplete="off">
     <div class="err" id="ae"></div>
     <button style="width:100%;margin-top:6px" onclick="tryAccess()">Proceed ➜</button>
   </div>`;
  const i=document.getElementById("ac");i.focus();
  i.addEventListener("keydown",e=>{if(e.key==="Enter")tryAccess();});
}
window.tryAccess=function(){
  const v=document.getElementById("ac").value.trim();
  if(v===CONFIG.ACCESS_CODE){sessionStorage.setItem("access","1");beep(660,120);screenTeams();}
  else{document.getElementById("ae").textContent="Wrong code. The clock is ticking…";beep(140,220);document.getElementById("ac").value="";}
};
async function screenTeams(){
  app.innerHTML=`<div class="card"><div class="brand center">Choose your cell</div>
     <h2 class="center" style="margin:8px 0 20px">Select your team</h2>
     <div id="teamGrid"><div class="spinner"></div></div></div>`;
  let teams;
  try{ teams=await DB.getTeams(); }
  catch(e){ console.error("TEAMS LOAD ERROR:",e);
    document.getElementById("teamGrid").innerHTML=`<p class="err">Could not load teams: ${esc(e.message||e)}</p>`; return; }
  const grid=document.getElementById("teamGrid");
  if(!teams.length){grid.innerHTML=`<p class="err">No teams found in the "${CONFIG.TEAMS_COLLECTION}" collection.</p>`;return;}
  grid.className="grid2";grid.innerHTML="";
  teams.slice(0,4).forEach(t=>{
    const done=(t.solved||[]).length>=6;
    const el=document.createElement("div");el.className="tab"+(done?" solveddone":"");
    el.innerHTML=`<div class="tname">${esc(t.name)}</div><div class="tsub">Enter passcode</div>`;
    el.onclick=()=>askPasscode(t);grid.appendChild(el);
  });
}
function askPasscode(team){
  app.innerHTML=`
   <div class="card center" style="max-width:460px;margin:6vh auto 0">
     <div class="brand">${esc(team.name)}</div>
     <h2 style="margin:10px 0 18px">🔑 Passcode required</h2>
     <input id="pc" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
     <div class="err" id="pe"></div>
     <div class="footerbar">
       <button class="ghost" onclick="screenTeams()">← Back</button>
       <button onclick="checkPass('${team.id}','${encodeURIComponent(team.passcode)}')">Unlock ➜</button>
     </div>
   </div>`;
  const i=document.getElementById("pc");i.focus();
  i.addEventListener("keydown",e=>{if(e.key==="Enter")checkPass(team.id,encodeURIComponent(team.passcode));});
}
window.checkPass=function(id,encPass){
  const real=decodeURIComponent(encPass);
  const v=document.getElementById("pc").value.trim();
  if(v===real){sessionStorage.setItem("team",id);beep(660,120);go(`?team=${id}&intro=1`);}
  else{document.getElementById("pe").textContent="Incorrect passcode.";beep(140,220);document.getElementById("pc").value="";}
};

/* ---- NEW: intro briefing video (shown right after passcode) ---- */
async function screenIntro(teamId){
  app.innerHTML=`<div class="card"><div class="spinner"></div></div>`;
  let team;
  try{ team=await DB.getTeam(teamId); }catch(e){ team=null; }
  const name = team? team.name : "Team";
  app.innerHTML=`
   <div class="card center">
     <div class="brand">${esc(name)} • Mission Briefing</div>
     <h2 style="margin:8px 0 6px">🎬 Watch this before you begin</h2>
     <p class="muted" style="margin:0 0 12px">Your briefing is playing below. When you're ready, continue to the riddles.</p>
     <div class="videobox">
       <video src="${CONFIG.INTRO_VIDEO_URL}" controls autoplay playsinline preload="auto"></video>
     </div>
     <div class="footerbar">
       <button onclick="go('?team=${teamId}')">Continue to riddles ➜</button>
     </div>
     <p class="muted small" style="margin-top:10px">Video not loading? Make sure <b>${esc(CONFIG.INTRO_VIDEO_URL)}</b> is uploaded to the same GitHub folder as this page.</p>
   </div>`;
}

async function screenDashboard(teamId){
  app.innerHTML=`<div class="card"><div class="spinner"></div></div>`;
  let team;
  try{ team=await DB.getTeam(teamId); }
  catch(e){ console.error("DASHBOARD LOAD ERROR:",e);
    app.innerHTML=`<div class="card"><p class="err">Could not load team: ${esc(e.message||e)}</p>
      <div class="footerbar"><button class="ghost" onclick="location.search=''">← Back to teams</button></div></div>`; return; }
  if(!team){app.innerHTML=`<div class="card"><p class="err">Team not found.</p>
      <div class="footerbar"><button class="ghost" onclick="location.search=''">← Back to teams</button></div></div>`;return;}
  const solved=team.solved||[];const base=location.origin+location.pathname;let links="";
  for(let n=1;n<=6;n++){const done=solved.includes(n);
    links+=`<a class="rlink ${done?'done':''}" href="?team=${teamId}&riddle=${n}"><span>🧩 Riddle ${n}</span><span class="st">${done?'✓ solved':'open →'}</span></a>`;}
  app.innerHTML=`
   <div class="card">
     <div class="brand">${esc(team.name)}</div>
     <h2 style="margin:8px 0 4px">Your 6 riddles</h2>
     <p class="muted small" style="margin:0 0 16px">Solve all six to escape. Progress is saved automatically. Solved: ${solved.length}/6</p>
     <div class="riddle-links">${links}</div>
     <div class="hint" style="margin-top:16px">🎬 <a class="link" href="?team=${teamId}&intro=1">Re-watch the briefing video</a></div>
     <div class="hint" style="margin-top:12px">🔗 Each riddle also has its own shareable link:
        <br><span class="small">${esc(base)}?team=${teamId}&riddle=<b>N</b></span>
        <button class="ghost small" style="padding:8px 12px;margin-top:10px" onclick="copyLinks('${teamId}')">Copy all 6 links</button>
     </div>
     <div class="footerbar"><button class="ghost" onclick="location.search=''">Log out</button></div>
   </div>`;
}
window.copyLinks=function(id){
  const base=location.origin+location.pathname;
  const txt=[1,2,3,4,5,6].map(n=>`Riddle ${n}: ${base}?team=${id}&riddle=${n}`).join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast("6 links copied","good"),()=>toast("Copy failed","bad"));
};
async function screenRiddle(teamId,n){
  const r=RIDDLES[n];
  if(!r){app.innerHTML=`<div class="card"><p class="err">Unknown riddle.</p></div>`;return;}
  let team;
  try{ team=await DB.getTeam(teamId); }
  catch(e){ console.error("RIDDLE LOAD ERROR:",e);
    app.innerHTML=`<div class="card"><p class="err">Could not load team: ${esc(e.message||e)}</p></div>`; return; }
  if(!team){app.innerHTML=`<div class="card"><p class="err">Team not found. Use your team link.</p></div>`;return;}
  const already=(team.solved||[]).includes(n);
  app.innerHTML=`
   <div class="card center">
     <div class="brand">${esc(team.name)} • ${r.title}</div>
     <h2 style="margin:8px 0 2px">Move only ONE stick</h2>
     <p class="muted" style="margin:4px 0 6px">Tap a matchstick to lift it, then tap an empty slot to place it.</p>
     <div id="puzzleArea"></div>
     <div class="footerbar">
       <button class="ghost" onclick="resetPuzzle()">↺ Reset sticks</button>
       <a class="rlink" style="width:auto" href="?team=${teamId}">← All riddles</a>
     </div>
   </div>`;
  if(already){renderOutput(n);return;}
  mountPuzzle(n,teamId);
}
let PZ=null;
function mountPuzzle(n,teamId){const r=RIDDLES[n];const model=buildRiddle(r);PZ={n,teamId,model,current:new Set(model.initSet),held:null,locked:false};drawPuzzle();}
function drawPuzzle(){
  const {model,current,held}=PZ;const area=document.getElementById("puzzleArea");
  const stage=document.createElement("div");stage.className="stage";stage.style.width=model.width+"px";stage.style.height=model.height+"px";
  model.statics.forEach(s=>{const el=document.createElement("div");el.className="stick static "+(s.w>s.h?"h":"v");el.style.cssText=`left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px`;stage.appendChild(el);});
  model.slots.forEach(s=>{const isOn=current.has(s.key);const el=document.createElement("div");
    if(isOn){el.className="stick "+s.o+(held===s.key?" held":"");el.style.cssText=`left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px`;el.onclick=()=>pick(s.key);}
    else{el.className="slot"+(held?" active":"");el.style.cssText=`left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px`;el.onclick=()=>held?place(s.key):null;}
    stage.appendChild(el);});
  area.innerHTML="";const scaler=document.createElement("div");scaler.className="stage-scaler";scaler.appendChild(stage);area.appendChild(scaler);fitStage(stage,model.width);
}
function fitStage(stage,w){const avail=Math.min(document.querySelector(".card").clientWidth-20,860);const scale=Math.min(1,avail/w);stage.style.transform=`scale(${scale})`;stage.parentElement.style.height=(PZ.model.height*scale)+"px";}
window.addEventListener("resize",()=>{const s=document.querySelector(".stage");if(s&&PZ)fitStage(s,PZ.model.width);});
function pick(key){if(PZ.locked)return;if(PZ.held===key){PZ.current.add(key);PZ.held=null;drawPuzzle();return;}if(PZ.held){toast("You may move only one stick","bad");return;}PZ.current.delete(key);PZ.held=key;drawPuzzle();}
function place(key){if(PZ.locked||!PZ.held)return;PZ.current.add(key);PZ.held=null;drawPuzzle();evaluate();}
window.resetPuzzle=function(){if(!PZ)return;PZ.current=new Set(PZ.model.initSet);PZ.held=null;PZ.locked=false;drawPuzzle();};
function evaluate(){const {model,current,n,teamId}=PZ;if(setEq(current,model.initSet))return;if(setEq(current,model.targetSet)){success(n,teamId);}else{PZ.locked=true;toast("❌ Not quite. Try again","bad");beep(150,260);setTimeout(()=>{PZ.current=new Set(model.initSet);PZ.held=null;PZ.locked=false;drawPuzzle();},1100);}}
async function success(n,teamId){PZ.locked=true;beep(880,140);setTimeout(()=>beep(1180,220),150);overlayText.textContent="✅ CORRECT!";overlay.classList.add("show");confettiBurst();try{await DB.markSolved(teamId,n);}catch(e){console.error("SAVE ERROR:",e);}setTimeout(()=>{overlay.classList.remove("show");renderOutput(n);},1900);}
function renderOutput(n){
  const r=RIDDLES[n];const area=document.getElementById("puzzleArea");const segs=digitSegs(r.output);const w=DW,h=DH;let sticks="";
  ["a","b","c","d","e","f","g"].forEach(id=>{if(!segs.has(id))return;const g=digitGeo(id);
    sticks+=`<div class="stick ${g.o}" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;background:linear-gradient(180deg,#7bf0a5,#2fbf6a);cursor:default"></div>`;});
  area.innerHTML=`<div class="output-box"><div class="rn">${r.title}</div>
     <div class="stage-scaler"><div class="stage" style="width:${w}px;height:${h}px">${sticks}</div></div>
     <div class="ok" style="font-weight:800;letter-spacing:3px;margin-top:6px">SOLVED ✓</div></div>`;
  const st=area.querySelector(".stage");const scale=Math.min(1,(document.querySelector(".card").clientWidth-40)/w*0.55);st.style.transform=`scale(${scale})`;st.parentElement.style.height=(h*scale)+"px";
}
/* ============ 6) ROUTER ============ */
(function route(){
  const team=qp("team"),riddle=qp("riddle"),intro=qp("intro");
  if(team&&riddle){screenRiddle(team,parseInt(riddle,10));return;}
  if(team&&intro){screenIntro(team);return;}
  if(team){screenDashboard(team);return;}
  screenAccess();
})();
</script>
